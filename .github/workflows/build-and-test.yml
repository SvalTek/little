name: Build and test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: develop
      package_kind:
        description: Package type
        required: true
        type: choice
        default: development
        options:
          - development
          - release

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - uses: go-task/setup-task@v2

      - name: Install Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Configure Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -Recurse |
            Where-Object FullName -Match '[\\/]ucrt64[\\/]bin[\\/]gcc\.exe$' |
            Select-Object -First 1
          if (!$gcc) { throw 'MSYS2 UCRT64 gcc.exe was not found.' }
          $gccPath = Split-Path $gcc.DirectoryName
          Set-Content -Encoding utf8 .env "GCC_PATH=$gccPath"

      - name: Run tests
        run: task test

      - name: Package development CLI and native libraries
        if: hashFiles('nativelib/json/json.c') != '' && github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        run: task package TARGET=${{ matrix.target }}

      - name: Package release CLI and native libraries
        if: hashFiles('nativelib/json/json.c') != '' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release'))
        run: task package:release TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: hashFiles('nativelib/json/json.c') != ''
        with:
          name: little-${{ matrix.target }}
          path: |
            dist/little-${{ matrix.target }}*
            dist/nativelibs-${{ matrix.target }}.zip
          if-no-files-found: error
