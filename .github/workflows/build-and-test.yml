name: Build, test, and package

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: develop
      package_kind:
        description: Package type
        required: true
        type: choice
        default: development
        options:
          - development
          - release

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: go-task/setup-task@v2
      - name: Build CLI
        run: task build
      - name: Build release CLI
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        run: task build:release
      - name: Build native libraries
        if: hashFiles('nativelib/json/json.c') != ''
        run: task build:nativelibs
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: |
            build/little.exe
            build/little-release.exe
            nativelib/json/build/json.so
            nativelib/webui/build/webui.so
          if-no-files-found: error

  test-linux:
    name: Test Linux
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: go-task/setup-task@v2
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: .
      - name: Run tests
        run: task test

  package-linux:
    name: Package Linux
    needs: test-linux
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.package-ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: .
      - name: Create development package
        if: hashFiles('nativelib/json/json.c') != '' && github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        shell: pwsh
        run: ./scripts/package.ps1 -Target linux-x64
      - name: Create release package
        if: hashFiles('nativelib/json/json.c') != '' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release'))
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target linux-x64 -Binary build/little-release.exe
      - name: Mark package ready
        id: package-ready
        if: hashFiles('nativelib/json/json.c') != ''
        shell: pwsh
        run: '"ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - uses: actions/upload-artifact@v4
        if: hashFiles('nativelib/json/json.c') != ''
        with:
          name: little-linux-x64
          path: dist/little-linux-x64.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: go-task/setup-task@v2
      - name: Install C toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure toolchain
        shell: pwsh
        run: |
          $gcc = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -Recurse |
            Where-Object FullName -Match '[\\/]ucrt64[\\/]bin[\\/]gcc\.exe$' |
            Select-Object -First 1
          if (!$gcc) { throw 'MSYS2 UCRT64 gcc.exe was not found.' }
          $gccPath = Split-Path $gcc.DirectoryName
          Set-Content -Encoding utf8 .env "GCC_PATH=$gccPath"
      - name: Build CLI
        run: task build
      - name: Build release CLI
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        run: task build:release
      - name: Build native libraries
        if: hashFiles('nativelib/json/json.c') != ''
        run: task build:nativelibs
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-x64
          path: |
            build/little.exe
            build/little-release.exe
            nativelib/json/build/json.dll
            nativelib/webui/build/webui.dll
          if-no-files-found: error

  test-windows:
    name: Test Windows
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: go-task/setup-task@v2
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x64
          path: .
      - name: Run tests
        run: task test

  package-windows:
    name: Package Windows
    needs: test-windows
    runs-on: windows-latest
    outputs:
      release_ready: ${{ steps.package-ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x64
          path: .
      - name: Create development package
        if: hashFiles('nativelib/json/json.c') != '' && github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        shell: pwsh
        run: ./scripts/package.ps1 -Target windows-x64
      - name: Create release package
        if: hashFiles('nativelib/json/json.c') != '' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release'))
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target windows-x64 -Binary build/little-release.exe
      - name: Mark package ready
        id: package-ready
        if: hashFiles('nativelib/json/json.c') != ''
        shell: pwsh
        run: '"ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'
      - uses: actions/upload-artifact@v4
        if: hashFiles('nativelib/json/json.c') != ''
        with:
          name: little-windows-x64
          path: dist/little-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [package-linux, package-windows]
    if: needs.package-linux.outputs.release_ready == 'true' && needs.package-windows.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: little-linux-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: little-windows-x64
          path: release
      - name: Choose release
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            $tag = "pr-$env:PULL_REQUEST_NUMBER"
            $title = "PR #$env:PULL_REQUEST_NUMBER development build"
            $prerelease = 'true'
          }
          elseif ($env:REF_NAME -eq 'main' -or $env:REQUESTED_REF -match '(^|/)main$') {
            $tag = 'main'
            $title = 'Main release build'
            $prerelease = 'false'
          }
          else {
            $tag = 'develop'
            $title = 'Develop build'
            $prerelease = 'true'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Publish ZIPs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $files = @('release/little-linux-x64.zip', 'release/little-windows-x64.zip')
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          }
          elseif ($env:PRERELEASE -eq 'true') {
            gh release create $env:TAG $files --title $env:TITLE --notes 'Automated development build.' --prerelease
          }
          else {
            gh release create $env:TAG $files --title $env:TITLE --notes 'Automated main build.'
          }
