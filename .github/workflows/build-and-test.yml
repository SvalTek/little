name: Build and test

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - uses: go-task/setup-task@v2

      - name: Install Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Configure Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-Content -Encoding utf8 .env 'GCC_PATH=C:\msys64\ucrt64'

      - name: Run tests
        run: task test

      - name: Package CLI and native libraries
        run: task package TARGET=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: little-${{ matrix.target }}
          path: |
            dist/little-${{ matrix.target }}*
            dist/nativelibs-${{ matrix.target }}.zip
          if-no-files-found: error
