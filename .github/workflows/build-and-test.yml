name: Build, test, and package

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and package
        required: true
        default: develop
      package_kind:
        description: Package type
        required: true
        type: choice
        default: development
        options:
          - development
          - release

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: go-task/setup-task@v2
      - name: Build CLI
        run: task build
      - name: Build release CLI
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        run: task build:release
      - name: Build native libraries
        if: hashFiles('nativelib/json/json.c') != ''
        run: task build:nativelibs
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: |
            build/little.exe
            build/little-release.exe
            nativelib/json/build/json.so
            nativelib/webui/build/webui.so
          if-no-files-found: error

  test-linux:
    name: Test Linux
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: go-task/setup-task@v2
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: .
      - name: Run tests
        run: task test

  package-linux:
    name: Package Linux
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          path: .
      - name: Create development package
        if: hashFiles('nativelib/json/json.c') != '' && github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        shell: pwsh
        run: ./scripts/package.ps1 -Target linux-x64
      - name: Create release package
        if: hashFiles('nativelib/json/json.c') != '' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release'))
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target linux-x64 -Binary build/little-release.exe
      - uses: actions/upload-artifact@v4
        if: hashFiles('nativelib/json/json.c') != ''
        with:
          name: little-linux-x64
          path: dist/little-linux-x64.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: go-task/setup-task@v2
      - name: Install C toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Configure toolchain
        shell: pwsh
        run: |
          $gcc = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -Recurse |
            Where-Object FullName -Match '[\\/]ucrt64[\\/]bin[\\/]gcc\.exe$' |
            Select-Object -First 1
          if (!$gcc) { throw 'MSYS2 UCRT64 gcc.exe was not found.' }
          $gccPath = Split-Path $gcc.DirectoryName
          Set-Content -Encoding utf8 .env "GCC_PATH=$gccPath"
      - name: Build CLI
        run: task build
      - name: Build release CLI
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        run: task build:release
      - name: Build native libraries
        if: hashFiles('nativelib/json/json.c') != ''
        run: task build:nativelibs
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-x64
          path: |
            build/little.exe
            build/little-release.exe
            nativelib/json/build/json.dll
            nativelib/webui/build/webui.dll
          if-no-files-found: error

  test-windows:
    name: Test Windows
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: go-task/setup-task@v2
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x64
          path: .
      - name: Run tests
        run: task test

  package-windows:
    name: Package Windows
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-x64
          path: .
      - name: Create development package
        if: hashFiles('nativelib/json/json.c') != '' && github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release')
        shell: pwsh
        run: ./scripts/package.ps1 -Target windows-x64
      - name: Create release package
        if: hashFiles('nativelib/json/json.c') != '' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.package_kind == 'release'))
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target windows-x64 -Binary build/little-release.exe
      - uses: actions/upload-artifact@v4
        if: hashFiles('nativelib/json/json.c') != ''
        with:
          name: little-windows-x64
          path: dist/little-windows-x64.zip
          if-no-files-found: error
