version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the baseline little CLI into build/little.exe
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./build.ps1
    sources:
      - main.c
      - src/*.c
      - src/*.h
      - nativelib/term/**
      - vendor/pdcursesmod/**
    generates:
      - build/little.exe

  build:baseline:
    desc: Build baseline CLI into build/little-baseline.exe
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./build.ps1 -Output build/little-baseline.exe
    sources:
      - main.c
      - src/*.c
      - src/*.h
      - nativelib/term/**
      - vendor/pdcursesmod/**
    generates:
      - build/little-baseline.exe

  build:release:
    desc: Build normal release CLI with -O2 -DNDEBUG -s
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./build.ps1 -Output build/little-release.exe -CFlags "-O2 -DNDEBUG" -LdFlags "-s"
    sources:
      - main.c
      - src/*.c
      - src/*.h
      - nativelib/term/**
      - vendor/pdcursesmod/**
    generates:
      - build/little-release.exe

  build:small:
    desc: Build small release CLI with -Os -DNDEBUG -s
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./build.ps1 -Output build/little-small.exe -CFlags "-Os -DNDEBUG" -LdFlags "-s"
    sources:
      - main.c
      - src/*.c
      - src/*.h
      - nativelib/term/**
      - vendor/pdcursesmod/**
    generates:
      - build/little-small.exe

  build:small-aggressive:
    desc: Build aggressive small release CLI with LTO, function section GC, and no unwind tables
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./build.ps1 -Output build/little-small-aggressive.exe -CFlags "-Os -DNDEBUG -flto -ffunction-sections -fno-asynchronous-unwind-tables -fno-unwind-tables" -LdFlags "-flto -Wl,--gc-sections -s"
    sources:
      - main.c
      - src/*.c
      - src/*.h
      - nativelib/term/**
      - vendor/pdcursesmod/**
    generates:
      - build/little-small-aggressive.exe

  build:variants:
    desc: Build baseline and release-size variants
    deps:
      - build:baseline
      - build:release
      - build:small
      - build:small-aggressive

  build:nativelibs:
    desc: Build optional native libraries
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./nativelib/build.ps1
    sources:
      - nativelib/**/*.c
      - src/*.h
      - vendor/webui/**
    generates:
      - nativelib/json/build/json.dll
      - nativelib/json/build/json.so
      - nativelib/json/build/json.dylib

  sizes:
    desc: Build release-size variants and print artifact sizes
    deps: [build:variants]
    cmds:
      - pwsh -NoProfile -Command "Get-Item build/little-baseline.exe, build/little-release.exe, build/little-small.exe, build/little-small-aggressive.exe | Sort-Object Name | Format-Table Name,Length"

  test:
    desc: Run end-to-end language tests
    deps: [build]
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./test.ps1

  scripts:
    desc: Run the runnable Little scripts
    deps: [build]
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./scripts/run.ps1

  package:
    desc: Package the built CLI and native libraries for one platform target
    deps: [build, build:nativelibs]
    requires:
      vars: [TARGET]
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./scripts/package.ps1 -Target {{.TARGET}}

  package:release:
    desc: Package the optimized release CLI and native libraries for one platform target
    deps: [build:release, build:nativelibs]
    requires:
      vars: [TARGET]
    cmds:
      - pwsh -ExecutionPolicy Bypass -File ./scripts/package.ps1 -Target {{.TARGET}} -Binary build/little-release.exe

  clean:
    desc: Remove generated build output
    cmds:
      - pwsh -NoProfile -Command "if (Test-Path build) { Remove-Item -Recurse -Force build }; Get-ChildItem nativelib -Directory -ErrorAction SilentlyContinue | ForEach-Object { $nativeBuild = Join-Path $_.FullName 'build'; if (Test-Path $nativeBuild) { Remove-Item -Recurse -Force $nativeBuild } }"
